name: 持仓预警监控

on:
  # 定时触发 - 每天北京时间 18:30 (UTC 10:30)，避开 18:00 的主分析
  schedule:
    - cron: '30 10 * * 1-5'    # 周一到周五，UTC 10:30 = 北京时间 18:30

  # 手动触发
  workflow_dispatch:
    inputs:
      portfolio_path:
        description: '持仓 JSON 路径（默认 data/portfolio.json）'
        required: false
        default: 'data/portfolio.json'
        type: string
      dry_run:
        description: 'dry-run：不真正推送，只打 markdown 预览'
        required: false
        default: false
        type: boolean
      warning:
        description: '回撤档·警告阈值 %'
        required: false
        default: '20.0'
        type: string
      severe:
        description: '回撤档·严重阈值 %'
        required: false
        default: '50.0'
        type: string
      critical:
        description: '回撤档·危急阈值 %'
        required: false
        default: '80.0'
        type: string
      min_gain:
        description: '回撤档·最低浮盈 %（没涨够不算回撤）'
        required: false
        default: '5.0'
        type: string
      stop_loss:
        description: '止损·跌破成本 % 即触发（单档）'
        required: false
        default: '5.0'
        type: string

# 并发控制：错开主分析的 18:00 跑
concurrency:
  group: position-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai   # 全 job 用东八区时间，让 engine 的 date.today() 和 Longbridge end_date 都按 HKT/CST 解读

    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          # 用 3.12 而非 00-workflow 的 3.11：requirements.txt 里 Longbridge 的
          # 条件表达式是 `longbridge==0.2.74; Linux and python_version < "3.12"`，
          # 3.11 会装到 0.2.74，而它在 LONGBRIDGE_REGION=cn 下的
          # history_candlesticks 仍返回空日线（QuoteContext 能建但取不到数据）。
          # 3.12 走 `longbridge>=4.0.5`，与本地验证通过的版本一致。
          # GitHub Actions 的 ubuntu-24.04 是 glibc 2.39，满足 4.x wheel 要求
          # （该限制只影响项目 Dockerfile 用的 bookworm/glibc 2.36）。
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖（与 00-daily-analysis.yml 一致：完整 requirements.txt）
        run: |
          pip install --upgrade pip
          # 跟 00 一样装完整 requirements.txt —— 7-fetcher fallback 需要 tenacity/pytdx/tickflow/baostock/yfinance 全部就位，
          # 之前手挑 8 个包在 EastMoney/Akshare 同时挂时无路可退，全 0 触发。
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 运行持仓预警（回撤 + 止损）
        env:
          # ==========================================
          # 通知渠道（与 00-daily-analysis.yml 保持一致；任一配置即生效）
          # ==========================================
          # 企业微信 Webhook
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          WECHAT_MSG_TYPE: ${{ vars.WECHAT_MSG_TYPE || secrets.WECHAT_MSG_TYPE || 'markdown' }}
          # 飞书 Webhook
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
          # 钉钉 Webhook
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          # 邮件
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'daily_stock_analysis股票分析助手' }}
          # Pushover
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          # ntfy
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Gotify
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          # PushPlus
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC || secrets.PUSHPLUS_TOPIC }}
          # 自定义 Webhook
          CUSTOM_WEBHOOK_URLS: ${{ secrets.CUSTOM_WEBHOOK_URLS }}
          CUSTOM_WEBHOOK_BEARER_TOKEN: ${{ secrets.CUSTOM_WEBHOOK_BEARER_TOKEN }}
          CUSTOM_WEBHOOK_BODY_TEMPLATE: ${{ vars.CUSTOM_WEBHOOK_BODY_TEMPLATE || secrets.CUSTOM_WEBHOOK_BODY_TEMPLATE }}
          WEBHOOK_VERIFY_SSL: ${{ vars.WEBHOOK_VERIFY_SSL || secrets.WEBHOOK_VERIFY_SSL || 'true' }}
          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MAIN_CHANNEL_ID: ${{ secrets.DISCORD_MAIN_CHANNEL_ID }}
          # 飞书云文档（App 模式）
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_FOLDER_TOKEN: ${{ secrets.FEISHU_FOLDER_TOKEN }}
          FEISHU_CHAT_ID: ${{ vars.FEISHU_CHAT_ID || secrets.FEISHU_CHAT_ID }}
          FEISHU_RECEIVE_ID_TYPE: ${{ vars.FEISHU_RECEIVE_ID_TYPE || secrets.FEISHU_RECEIVE_ID_TYPE }}
          FEISHU_DOMAIN: ${{ vars.FEISHU_DOMAIN || secrets.FEISHU_DOMAIN }}
          FEISHU_SEND_AS_FILE: ${{ vars.FEISHU_SEND_AS_FILE || secrets.FEISHU_SEND_AS_FILE }}
          # AstrBot
          ASTRBOT_URL: ${{ secrets.ASTRBOT_URL }}
          ASTRBOT_TOKEN: ${{ secrets.ASTRBOT_TOKEN }}
          # Server酱3
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          # Slack
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

          # ==========================================
          # 持仓文件 + 阈值（全部走环境变量，不再传 CLI 参数）
          # vars 提供可调默认值；user 改 vars 即可调整，无需改 workflow
          # ==========================================
          POSITION_DRAWDOWN_JSON_PATH: ${{ github.event.inputs.portfolio_path || vars.POSITION_DRAWDOWN_JSON_PATH || secrets.POSITION_DRAWDOWN_JSON_PATH || 'data/portfolio.json' }}
          POSITION_DRAWDOWN_WARNING_PCT: ${{ github.event.inputs.warning || vars.POSITION_DRAWDOWN_WARNING_PCT || secrets.POSITION_DRAWDOWN_WARNING_PCT || '20.0' }}
          POSITION_DRAWDOWN_SEVERE_PCT: ${{ github.event.inputs.severe || vars.POSITION_DRAWDOWN_SEVERE_PCT || secrets.POSITION_DRAWDOWN_SEVERE_PCT || '50.0' }}
          POSITION_DRAWDOWN_CRITICAL_PCT: ${{ github.event.inputs.critical || vars.POSITION_DRAWDOWN_CRITICAL_PCT || secrets.POSITION_DRAWDOWN_CRITICAL_PCT || '80.0' }}
          # ② 止损：单档，直接跌破成本线即触发（不需要曾经涨过）
          POSITION_DRAWDOWN_STOP_LOSS_PCT: ${{ github.event.inputs.stop_loss || vars.POSITION_DRAWDOWN_STOP_LOSS_PCT || secrets.POSITION_DRAWDOWN_STOP_LOSS_PCT || '5.0' }}
          # 峰值浮盈门槛：滤掉从没真正涨过的仓位（如货币基金、刚建仓的定存）
          POSITION_DRAWDOWN_MIN_GAIN_PCT: ${{ github.event.inputs.min_gain || vars.POSITION_DRAWDOWN_MIN_GAIN_PCT || secrets.POSITION_DRAWDOWN_MIN_GAIN_PCT || '5.0' }}
          # Gist URL：raw URL 是 access token，常放 secrets。
          # env 块允许 secrets.X；放 step-level 因为现在 Gist 拉取已合并到 runner step 里。
          POSITION_DRAWDOWN_GIST_URL: ${{ vars.POSITION_DRAWDOWN_GIST_URL || secrets.POSITION_DRAWDOWN_GIST_URL || '' }}
          # Yfinance 垫底（P9，默认 4）。港股延迟 1 天，压到链尾可让 Longbridge
          # 自动排到它前面（港股链变成 akshare → longbridge → yfinance）。
          # A 股则让 Tencent(默认5) 排到它之前，多一个可用源。
          YFINANCE_PRIORITY: '9'
          # 不改 LONGBRIDGE_PRIORITY（默认 5）：Yfinance 垫底后它自动排到港股链
          # 的 Yfinance 之前；A 股链路里它排第 6，前面 5 个都是纯 A 股源，
          # 正常时走不到，不会触发 "Cannot convert <code> to Longbridge symbol"
          # （该 fetcher 只支持港股/美股，见 _to_longbridge_symbol）。
          # Longbridge 接入点：必须显式设为 cn。
          # SDK 自动判断（region=auto）在部分网络下会落回 .com 国际端点，
          # 其 WebSocket 连不上 → QuoteContext 若干秒后 "context dropped"，
          # 连纯 HTTP 的 history_candlesticks 也一起挂掉（都挂在 QuoteContext 上）。
          # 设为 cn 走 openapi.longbridge.cn / openapi-quote.longbridge.cn。
          # 注意：region 生效后 SDK 0.2.74 仍返回空日线，必须配合上面的
          # python-version 3.12（SDK 4.x）才完全可用。
          # 官方文档：https://open.longbridge.com/zh-CN/docs/getting-started#api-host
          LONGBRIDGE_REGION: 'cn'
          # Longbridge Legacy 3 件套（APP_KEY / APP_SECRET / ACCESS_TOKEN）—— 凑齐就认
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          # 临时覆盖阈值（手动触发时用）—— 通过 inputs 注入到环境变量
          POSITION_DRAWDOWN_WARNING_PCT_OVERRIDE: ${{ github.event.inputs.warning }}
          POSITION_DRAWDOWN_SEVERE_PCT_OVERRIDE: ${{ github.event.inputs.severe }}
          POSITION_DRAWDOWN_CRITICAL_PCT_OVERRIDE: ${{ github.event.inputs.critical }}

        run: |
          # 1) 决定持仓文件来源：优先 Gist，没有则用 env 指定的本地路径
          #    Gist 拉到 /tmp/portfolio.json（上面 step env 里已设过 $POSITION_DRAWDOWN_GIST_URL，
          #    含 vars||secrets fallback —— raw URL 是 access token，常放 secrets）
          if [ -n "$POSITION_DRAWDOWN_GIST_URL" ]; then
            # 直接给一个 raw URL：https://gist.githubusercontent.com/<user>/<id>/raw/portfolio.json
            HTTP_STATUS=$(curl -s -o /tmp/portfolio.json -w "%{http_code}" "$POSITION_DRAWDOWN_GIST_URL")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::Gist 拉取失败，HTTP $HTTP_STATUS。检查 POSITION_DRAWDOWN_GIST_URL 是否正确 / URL 里文件名是否叫 portfolio.json。"
              cat /tmp/portfolio.json 2>/dev/null || true
              exit 1
            fi
            if [ ! -s /tmp/portfolio.json ]; then
              echo "::error::Gist 响应内容为空（HTTP 200 但 0 字节）"
              exit 1
            fi
            if ! python -c "import json; d=json.load(open('/tmp/portfolio.json')); assert isinstance(d.get('positions'), list)" 2>/dev/null; then
              echo "::error::Gist 内容不是合法 portfolio.json（需有顶层 positions 数组）"
              cat /tmp/portfolio.json
              exit 1
            fi
            PORTFOLIO="/tmp/portfolio.json"
            echo ">>> 持仓来源：Gist ($(wc -c < /tmp/portfolio.json) bytes)"
          else
            PORTFOLIO="$POSITION_DRAWDOWN_JSON_PATH"
            echo ">>> 持仓来源：本地文件 $PORTFOLIO"
          fi

          # 检查持仓文件存在
          if [ ! -f "$PORTFOLIO" ]; then
            echo "::warning::持仓文件 $PORTFOLIO 不存在，跳过本次预警。请把 portfolio.json 提交到 repo。"
            echo "模板："
            cat <<'EOF'
          {
            "description": "持仓清单",
            "updated_at": "2026-09-30 18:30:00",
            "positions": [
              { "code": "000776", "name": "广发证券", "cost_price": 10.00, "position_date": "2025-03-15" }
            ]
          }
          EOF
            exit 0
          fi

          # 检查至少配了一个通知渠道
          if [ -z "$FEISHU_WEBHOOK_URL" ] && [ -z "$FEISHU_APP_ID" ] \
             && [ -z "$WECHAT_WEBHOOK_URL" ] \
             && [ -z "$DINGTALK_WEBHOOK_URL" ] \
             && [ -z "$TELEGRAM_BOT_TOKEN" ] \
             && [ -z "$DISCORD_WEBHOOK_URL" ] && [ -z "$DISCORD_BOT_TOKEN" ] \
             && [ -z "$SLACK_WEBHOOK_URL" ] && [ -z "$SLACK_BOT_TOKEN" ] \
             && [ -z "$EMAIL_SENDER" ] \
             && [ -z "$PUSHOVER_USER_KEY" ] \
             && [ -z "$NTFY_URL" ] \
             && [ -z "$GOTIFY_URL" ] \
             && [ -z "$PUSHPLUS_TOKEN" ] \
             && [ -z "$CUSTOM_WEBHOOK_URLS" ] \
             && [ -z "$ASTRBOT_URL" ] \
             && [ -z "$SERVERCHAN3_SENDKEY" ]; then
            echo "::warning::未配置任何通知渠道 secrets，将以 dry-run 模式运行（只生成报告）"
            export POSITION_DRAWDOWN_DRY_RUN=true
          fi

          # 处理 dry_run 标志
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo ">>> dry-run 模式：不真正推送"
          fi

          # 阈值通过环境变量传给 cli.run()，不传 CLI 参数
          # （临时覆盖：inputs.warning 直接覆盖 POSITION_DRAWDOWN_WARNING_PCT）
          [ -n "$POSITION_DRAWDOWN_WARNING_PCT_OVERRIDE" ] && export POSITION_DRAWDOWN_WARNING_PCT="$POSITION_DRAWDOWN_WARNING_PCT_OVERRIDE"
          [ -n "$POSITION_DRAWDOWN_SEVERE_PCT_OVERRIDE" ] && export POSITION_DRAWDOWN_SEVERE_PCT="$POSITION_DRAWDOWN_SEVERE_PCT_OVERRIDE"
          [ -n "$POSITION_DRAWDOWN_CRITICAL_PCT_OVERRIDE" ] && export POSITION_DRAWDOWN_CRITICAL_PCT="$POSITION_DRAWDOWN_CRITICAL_PCT_OVERRIDE"

          echo ">>> 持仓文件: $PORTFOLIO"
          echo ">>> 回撤档: warning=$POSITION_DRAWDOWN_WARNING_PCT severe=$POSITION_DRAWDOWN_SEVERE_PCT critical=$POSITION_DRAWDOWN_CRITICAL_PCT (需先涨超 min_gain=$POSITION_DRAWDOWN_MIN_GAIN_PCT)"
          echo ">>> 止损: 跌破成本 $POSITION_DRAWDOWN_STOP_LOSS_PCT% 即触发（单档）"

          # CLI 不再写本地文件（避免累积），通过 --report-file 把 markdown 落到 reports/ 目录
          # 供后续 actions/upload-artifact 抓取。本地跑不要传 --report-file。
          REPORT_DATE=$(date +%F)
          REPORT_FILE="reports/position-drawdown/${REPORT_DATE}.md"
          mkdir -p "$(dirname "$REPORT_FILE")"

          # 全部 stdout+stderr 同时写到 logs/position-drawdown-run.log 供 artifact 抓取，
          # 排查时直接下载一份 log 就能看到 fetcher fallback / 错误堆栈，不用再回 GitHub UI 翻页。
          python -m src.position_drawdown.cli \
            --portfolio "$PORTFOLIO" \
            --report-file "$REPORT_FILE" \
            $DRY_FLAG \
            2>&1 | tee logs/position-drawdown-run.log

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: position-drawdown-${{ github.run_number }}
          # 同时传 markdown 报告 + 运行日志（包含 fetcher fallback / 错误堆栈），
          # 排查时下载一份 log 文件就能看到全链路，不用再回 GitHub Actions UI 翻页。
          path: |
            reports/position-drawdown/
            logs/position-drawdown-run.log
          retention-days: 90
          # 回撤脚本崩了 / 持仓文件缺 / 数据源全挂 时目录可能空着。
          # 默认 v6 会把"0 文件"判成 error，让 job 翻红 —— 但那只是清理步骤，
          # 真正的失败原因已经在前一步 exit 了。让这里静默成功，别污染 job 状态。
          if-no-files-found: ignore

      - name: 显示今日报告
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 持仓预警（回撤+止损） · ${{ github.run_number }}"
          echo "=========================================="
          if [ -d "reports/position-drawdown" ] && [ "$(ls -A reports/position-drawdown 2>/dev/null)" ]; then
            echo "生成的报告："
            ls -la reports/position-drawdown/
            LATEST=$(ls -t reports/position-drawdown/*.md 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              echo ""
              echo "--- $LATEST ---"
              cat "$LATEST"
            fi
          else
            echo "⚠️ 未生成报告"
          fi
